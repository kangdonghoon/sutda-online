<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한판 관리자</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2d23;--panel:rgba(5,22,17,.6);--ink:#f3ead7;--dim:#a9b8ad;--gold:#e3b54a;--gold2:#f5d27a;--line:rgba(243,234,215,.14);--bad:#e2685f;--ok:#9be3b5}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
header h1{font-family:"Black Han Sans";color:var(--gold2);margin:0;font-size:24px}
header a{color:var(--dim);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:16px;color:var(--gold2)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,button{font:inherit;color:inherit}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.inp:focus{border-color:var(--gold)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3b2706;border-color:transparent}
.btn.red{background:#5a221e;border-color:#7d2f29}
.btn.sm{padding:5px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.chipIn{width:120px;text-align:right}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--dim);margin-left:4px}
.tag.bad{background:#5a221e;color:#ffd0cb}.tag.gold{background:#5b4a1a;color:var(--gold2)}
.room .pl{display:inline-flex;align-items:center;gap:4px;margin:3px 10px 3px 0}
.dopt{font-size:11px;padding:1px 4px;border-radius:4px;background:#2a2219;color:var(--dim);border:1px solid rgba(255,255,255,.15)}
.dopt.on{background:#5a221e;color:#ffd0cb;border-color:#a33}
.muted{color:var(--dim);font-size:13px}
.room{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;color:var(--gold2);font-weight:700;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#081f18;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;font-size:14px}
.wrap{overflow-x:auto}
.reqIn{width:120px;text-align:right}
details summary{cursor:pointer;margin:12px 0 6px}
.st-approved{color:var(--ok)}.st-rejected{color:var(--bad)}.st-canceled{color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile small{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
.tile b{font-size:24px;color:var(--gold2);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--dim);margin-left:6px}
#rakeForm{align-items:center;gap:10px}
#rakeForm label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
#rakeForm input[type=number]{width:96px;text-align:right}
</style>
</head>
<body>
<header><h1>한판 관리자</h1><span class="muted" id="who"></span><span style="flex:1"></span><a href="/">게임으로</a></header>
<main id="main"><p class="muted">불러오는 중…</p></main>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n || 0).toLocaleString('ko-KR');
const ago = t => { if (!t) return '-'; const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 1440 ? Math.floor(m / 60) + '시간 전' : Math.floor(m / 1440) + '일 전'; };
let sess = null; try { sess = JSON.parse(localStorage.getItem('sutda-sess')); } catch(e){}
async function api(d){
  const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ sess }, d)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('오류 ' + r.status));
  return j;
}
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

async function init(){
  if (!sess) return deny('게임 화면에서 먼저 로그인하세요.');
  let me; try { me = await api({ t: 'me' }); } catch(e){ return deny('게임 화면에서 다시 로그인하세요.'); }
  if (!me.user.admin) return deny('관리자 계정이 아니에요. 서버의 ADMIN_USERS 환경변수에 아이디를 넣어야 해요.');
  $('#who').textContent = '@' + me.user.username;
  $('#main').innerHTML = `
    <section><h2>칩 요청 (충전·반납) <span id="reqCount"></span></h2>
      <div class="wrap"><table><thead><tr><th>회원</th><th style="text-align:right">현재 칩</th><th style="text-align:right">요청</th><th>메모</th><th>요청 시각</th><th>지급 / 회수할 칩</th><th></th></tr></thead><tbody id="reqs"></tbody></table></div>
      <details><summary class="muted">최근 처리 내역</summary>
        <div class="wrap"><table><thead><tr><th>처리 시각</th><th>회원</th><th style="text-align:right">요청</th><th style="text-align:right">지급 / 회수</th><th>결과</th><th>처리자</th></tr></thead><tbody id="reqsDone"></tbody></table></div>
      </details>
    </section>
    <section><h2>수수료</h2>
      <div class="tiles" id="rakeTiles"><div class="muted">불러오는 중…</div></div>
      <form id="rakeForm" class="bar">
        <label>수수료율 <input class="inp" type="number" id="rkRate" min="0" max="20" step="0.5"> %</label>
        <label>최대 <input class="inp" type="number" id="rkCap" min="0" step="100"></label>
        <label>최소 판돈 <input class="inp" type="number" id="rkMin" min="0" step="100"></label>
        <label><input type="checkbox" id="rkFolds"> 모두 다이한 판에도 적용</label>
        <button class="btn gold">저장</button>
      </form>
      <p class="muted" style="margin:0">판이 끝날 때 판돈(아무도 받지 않은 초과 베팅 제외)에서 떼요. 최대 0은 제한 없음, 수수료율 0%는 수수료 없음. 바꾼 설정은 각 방의 다음 판부터 적용돼요.</p>
    </section>
    <section><h2>회원</h2>
      <div class="bar"><input id="q" class="inp" placeholder="아이디·닉네임 검색" style="flex:1;min-width:180px"><button class="btn" id="qBtn">검색</button><button class="btn" id="reload">새로고침</button></div>
      <div class="wrap"><table><thead><tr><th>회원</th><th>방</th><th style="text-align:right">판 / 승</th><th style="text-align:right">충전</th><th>마지막 접속</th><th>칩</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
    </section>
    <section><h2>열린 방</h2><div id="rooms" class="muted">불러오는 중…</div></section>`;
  $('#qBtn').onclick = loadUsers; $('#reload').onclick = () => { loadUsers(); loadRooms(); };
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(); });
  $('#users').addEventListener('click', onUserClick);
  $('#rooms').addEventListener('click', onRoomClick);
  $('#rooms').addEventListener('change', async e => {
    const sel = e.target.closest('select.dopt'); if (!sel) return;
    try { await api({ t: 'admin.dealOpt', code: sel.dataset.room, pid: sel.dataset.pid, lv: Number(sel.value) }); sel.classList.toggle('on', sel.value !== '0'); sel.blur(); toast(DEAL_LV[sel.value] + ' 적용 (다음 딜부터)'); }
    catch(err){ toast(err.message); loadRooms(); }
  });
  $('#rakeForm').addEventListener('submit', saveRake);
  $('#reqs').addEventListener('click', onReqClick);
  loadReqs(); setInterval(loadReqs, 5000);
  loadUsers(); loadRooms(); loadRake(true);
  setInterval(loadRooms, 5000);
  setInterval(() => loadRake(false), 10000);
}
function deny(msg){ $('#main').innerHTML = `<section><h2>들어갈 수 없어요</h2><p>${esc(msg)}</p><a class="btn gold" href="/" style="text-decoration:none">게임으로 가기</a></section>`; }

async function loadUsers(){
  try {
    const list = await api({ t: 'admin.users', search: $('#q').value.trim() });
    $('#users').innerHTML = list.map(u => `<tr data-id="${u.id}">
      <td><b>${esc(u.nick)}</b> <span class="muted">@${esc(u.username)}</span>${u.admin ? '<span class="tag gold">관리자</span>' : ''}${u.banned ? '<span class="tag bad">정지</span>' : ''}</td>
      <td>${u.room ? `<span class="code">${esc(u.room.toUpperCase())}</span>` : '<span class="muted">-</span>'}</td>
      <td class="r">${won(u.hands)} / ${won(u.wins)}</td>
      <td class="r">${won(u.rebuys)}회<div class="muted">${won(u.bought || 0)}</div>${u.returned ? `<div class="muted">반납 ${won(u.returned)}</div>` : ''}</td>
      <td class="muted">${ago(u.lastSeen)}</td>
      <td><input class="inp chipIn" value="${u.chips}" inputmode="numeric"> <button class="btn sm" data-a="chips">저장</button></td>
      <td>${u.admin ? '' : `<button class="btn sm ${u.banned ? '' : 'red'}" data-a="ban" data-v="${u.banned ? 0 : 1}">${u.banned ? '정지 해제' : '정지'}</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">회원이 없어요</td></tr>';
  } catch(e){ toast(e.message); }
}
async function onUserClick(e){
  const b = e.target.closest('[data-a]'); if (!b) return;
  const tr = b.closest('tr'), id = Number(tr.dataset.id);
  try {
    if (b.dataset.a === 'chips') {
      const v = Number(tr.querySelector('.chipIn').value.replace(/,/g, ''));
      await api({ t: 'admin.chips', id, chips: v }); toast('칩을 저장했어요');
    } else if (b.dataset.a === 'ban') {
      await api({ t: 'admin.ban', id, banned: b.dataset.v === '1' }); toast(b.dataset.v === '1' ? '정지했어요' : '정지를 풀었어요');
    }
    loadUsers();
  } catch(err){ toast(err.message); }
}
let reqSig = '';
async function loadReqs(force){
  try {
    const r = await api({ t: 'admin.requests' });
    const n = r.pending.length;
    document.title = (n ? `(${n}) ` : '') + '한판 관리자';
    $('#reqCount').innerHTML = n ? `<span class="tag bad" style="font-size:13px">${n}건 대기</span>` : '';
    // 입력 중인 금액이 지워지지 않게, 목록이 바뀔 때만 다시 그림
    const sig = r.pending.map(q => q.id + ':' + q.kind + ':' + q.chips + ':' + q.held + ':' + q.inHand).join(',');
    if (force || sig !== reqSig) {
      reqSig = sig;
      $('#reqs').innerHTML = r.pending.map(q => `<tr data-id="${q.id}">
        <td>${kindTag(q.kind)} <b>${esc(q.nick)}</b> <span class="muted">@${esc(q.username)}</span>${q.room ? ` <span class="code">${esc(q.room.toUpperCase())}</span>` : ''}${q.inHand ? `<span class="tag gold">${q.kind === 'return' ? (q.held == null ? '게임 중 · 판 끝나면 칩을 떼어 둠' : '게임 중') : '게임 중 · 판 끝나면 지급'}</span>` : ''}</td>
        <td class="r">${won(q.chips)}${q.kind === 'return' && q.held != null ? `<div class="muted">떼어 둔 칩 ${won(q.held)}</div>` : ''}</td><td class="r">${q.kind === 'return' ? '−' : '+'}${won(q.amount)}</td>
        <td>${q.note ? esc(q.note) : '<span class="muted">-</span>'}</td>
        <td class="muted">${ago(q.createdAt)}</td>
        <td><input class="inp reqIn" value="${q.kind === 'return' ? (q.held != null ? q.held : q.amount) : q.amount}" inputmode="numeric"></td>
        <td style="white-space:nowrap"><button class="btn sm gold" data-r="approve" data-kind="${q.kind}" ${q.kind === 'return' && q.held == null && q.inHand ? 'disabled' : ''}>${q.kind === 'return' ? '회수' : '승인'}</button> <button class="btn sm red" data-r="reject">거절</button></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">기다리는 요청이 없어요</td></tr>';
    }
    const label = { approved: '승인', rejected: '거절', canceled: '본인 취소' };
    $('#reqsDone').innerHTML = r.recent.map(q => `<tr><td class="muted">${q.decidedAt ? when(q.decidedAt) : '-'}</td><td>${kindTag(q.kind)} ${esc(q.nick)} <span class="muted">@${esc(q.username)}</span></td>
      <td class="r">${won(q.amount)}</td><td class="r">${q.granted != null ? (q.kind === 'return' ? '−' : '+') + won(q.granted) : '-'}</td><td class="st-${q.status}">${label[q.status] || q.status}</td><td class="muted">${q.decidedBy === 'self' ? '-' : esc(q.decidedBy || '')}</td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">처리 내역이 없어요</td></tr>';
  } catch(e){}
}
async function onReqClick(e){
  const b = e.target.closest('[data-r]'); if (!b) return;
  const tr = b.closest('tr'), id = Number(tr.dataset.id);
  b.disabled = true;
  try {
    if (b.dataset.r === 'approve') {
      const amount = Number(tr.querySelector('.reqIn').value.replace(/,/g, ''));
      const res = await api({ t: 'admin.approve', id, amount });
      toast(b.dataset.kind === 'return' ? `${won(res.taken || amount)} 회수했어요` : `${won(amount)} 지급을 승인했어요`);
    } else { await api({ t: 'admin.reject', id }); toast('요청을 거절했어요'); }
    loadReqs(true); loadUsers();
  } catch(err){ toast(err.message); b.disabled = false; loadReqs(true); }
}
const kindTag = k => k === 'return' ? '<span class="tag bad">반납</span>' : '<span class="tag gold">충전</span>';
const when = t => { const d = new Date(t); const p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
async function loadRake(fillForm){
  try {
    const r = await api({ t: 'admin.rake' });
    const st = r.stats;
    $('#rakeTiles').innerHTML = `
      <div class="tile"><small>오늘 (한국 시간)</small><b>${won(st.today)}</b><span>${won(st.todayN)}판</span></div>
      <div class="tile"><small>최근 7일</small><b>${won(st.week)}</b></div>
      <div class="tile"><small>전체 누적</small><b>${won(st.total)}</b><span>${won(st.n)}판</span></div>
      <div class="tile"><small>현재 설정</small><b style="font-size:20px">${r.settings.rate > 0 ? r.settings.rate + '%' : '없음'}</b><span>${r.settings.rate > 0 ? `최대 ${r.settings.cap ? won(r.settings.cap) : '무제한'} · 최소 판돈 ${won(r.settings.min)}` : ''}</span></div>`;
    if (fillForm) {
      $('#rkRate').value = r.settings.rate; $('#rkCap').value = r.settings.cap; $('#rkMin').value = r.settings.min; $('#rkFolds').checked = r.settings.folds;
    }
  } catch(e){ toast(e.message); }
}
async function saveRake(e){
  e.preventDefault();
  try {
    await api({ t: 'admin.rakeSet', rate: Number($('#rkRate').value), cap: Number($('#rkCap').value), min: Number($('#rkMin').value), folds: $('#rkFolds').checked });
    toast('수수료 설정을 저장했어요. 다음 판부터 적용돼요.'); loadRake(true);
  } catch(err){ toast(err.message); }
}
const DEAL_LV = ['딜 기본', '딜 1', '딜 2', '딜 3'];
async function loadRooms(){
  if (document.activeElement && document.activeElement.classList.contains('dopt')) return; // 고르는 중엔 새로 그리지 않음
  try {
    const list = await api({ t: 'admin.rooms' });
    $('#rooms').innerHTML = list.length ? list.map(r => `<div class="room"><div><span class="code">${esc(r.code.toUpperCase())}</span>
        <span class="muted"> · ${r.phase === 'bet' ? '게임 중' : '대기'} · ${r.hands}판</span>${r.practice ? '<span class="tag">봇 연습</span>' : ''}<span class="tag${r.kind !== 'sutda' ? ' gold' : ''}">${r.kind === 'holdem' ? '홀덤' : r.kind === 'poker7' ? '7포커' : r.kind === 'badugi' ? '바둑이' : '섯다'}</span>
        <div style="margin-top:4px">${r.players.map(p => `<span class="pl">${esc(p.name)}${p.host ? '<span class="tag gold">방장</span>' : ''}${p.bot ? '<span class="tag">봇</span>' : ''}${p.away ? '<span class="tag">자리비움</span>' : ''} <span class="muted">${won(p.chips)}</span>
          ${r.kind !== 'sutda' ? '' : `<select class="dopt${p.opt ? ' on' : ''}" title="딜 옵션" data-room="${esc(r.code)}" data-pid="${esc(p.id)}">${DEAL_LV.map((t, i) => `<option value="${i}" ${i === p.opt ? 'selected' : ''}>${t}</option>`).join('')}</select>`}</span>`).join('')}</div></div>
        <button class="btn sm red" data-close="${esc(r.code)}">방 닫기</button></div>`).join('') : '열린 방이 없어요';
  } catch(e){}
}
async function onRoomClick(e){
  const b = e.target.closest('[data-close]'); if (!b) return;
  if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '정말 닫기'; return; }
  try { await api({ t: 'admin.close', code: b.dataset.close }); toast('방을 닫았어요'); loadRooms(); } catch(err){ toast(err.message); }
}
init();
})();
</script>
</body>
</html>

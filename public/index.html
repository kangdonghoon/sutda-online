<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섯다 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="entry">
  <div class="hero"><h1 class="title">섯다</h1><div class="fan" id="heroFan"></div></div>
  <div class="sub">친구들과 같이 하는 2장 섯다. 칩은 가짜예요.</div>

  <div id="authBox" class="card-box hidden">
    <div class="tabs"><button class="tab on" data-tab="login">로그인</button><button class="tab" data-tab="signup">회원가입</button></div>
    <form id="authForm" autocomplete="on">
      <div class="field"><label for="aUser">아이디</label><input id="aUser" class="inp" maxlength="16" autocomplete="username" placeholder="영문 소문자·숫자 3~16자" autocapitalize="none"></div>
      <div class="field"><label for="aPw">비밀번호</label><input id="aPw" class="inp" type="password" maxlength="64" autocomplete="current-password" placeholder="6자 이상"></div>
      <div class="field signup-only hidden"><label for="aPw2">비밀번호 확인</label><input id="aPw2" class="inp" type="password" maxlength="64" autocomplete="new-password"></div>
      <div class="field signup-only hidden"><label for="aNick">닉네임</label><input id="aNick" class="inp" maxlength="10" placeholder="게임에서 보이는 이름"></div>
      <button class="btn gold" id="aSubmit" style="width:100%">로그인</button>
    </form>
  </div>

  <div id="profileBox" class="card-box hidden"></div>
  <div id="inviteBox" class="card-box hidden"></div>
  <div id="resumeBox" class="card-box hidden"></div>

  <div id="lobbyBoxes" class="hidden">
    <div class="card-box">
      <h3>새 방 만들기</h3>
      <div class="row"><button id="btnCreate" class="btn gold">방 만들기</button><button id="btnSolo" class="btn">봇이랑 연습</button></div>
      <div class="note">패는 서버가 섞고 나눠요. 칩과 전적은 계정에 저장돼요.</div>
    </div>
    <div class="card-box">
      <h3>방 들어가기</h3>
      <div class="row">
        <input id="joinCode" class="inp" maxlength="4" placeholder="방 코드 4자리" style="text-transform:lowercase">
        <button id="btnJoin" class="btn" style="flex:0 0 100px">입장</button>
      </div>
      <div style="margin-top:12px" class="tables" id="tables"><div class="muted">열린 방을 찾는 중…</div></div>
    </div>
  </div>

  <p class="credit">화투 그림: <a href="https://commons.wikimedia.org/wiki/File:Hwatu_overview.svg" target="_blank" rel="noopener">Marcus Richert</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> (잘라서 크기 조정)</p>
</section>

<!-- 게임 -->
<section id="game" class="hidden">
  <header>
    <span class="logo">섯다</span>
    <span class="muted">방</span><span class="code" id="hCode">----</span>
    <button class="hbtn" id="btnCopy">초대 링크 복사</button>
    <span class="chip-s" id="hNet">연결 중</span>
    <span class="sp"></span>
    <button class="hbtn" id="btnSound" title="효과음">🔊</button>
    <button class="hbtn" id="btnRanks">족보</button>
    <button class="hbtn" id="btnRebuy">칩 충전</button>
    <button class="hbtn" id="btnLeave">나가기</button>
  </header>
  <div id="main">
    <div id="hostbar" class="hidden"></div>
    <div id="tableWrap">
      <div class="blanket"></div>
      <div id="bets"></div>
      <div id="center"></div>
      <div id="seats"></div>
    </div>
    <div id="me"></div>
  </div>
  <aside>
    <h4>기록 · 채팅</h4>
    <div id="log"></div>
    <div class="emotes" id="emotes"></div>
    <p class="credit" style="padding:0 12px">화투 그림: <a href="https://commons.wikimedia.org/wiki/File:Hwatu_overview.svg" target="_blank" rel="noopener">Marcus Richert</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> (잘라서 크기 조정)</p>
    <form id="chatForm"><input id="chatIn" class="inp" maxlength="80" placeholder="채팅" autocomplete="off"><button class="btn">전송</button></form>
  </aside>
</section>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>

<script src="core.js"></script>
<script src="cards.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
